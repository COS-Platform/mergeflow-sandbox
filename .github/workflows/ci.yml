name: ci
# merge_group is the event the MERGE QUEUE fires — a check must trigger on it
# or the queue has nothing to gate on and will merge immediately.
on:
  pull_request:
  merge_group:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: unit tests
        run: python -m unittest discover -v
